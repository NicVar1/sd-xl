[project]
name = "sd-xl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NicVar1", email = "nicolasotero20a@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.41.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
sd-xl = "sd_xl:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

